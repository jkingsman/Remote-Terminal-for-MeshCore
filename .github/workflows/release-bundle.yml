name: Build release bundle

on:
  release:
    types: [published]
  pull_request:

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from release tag
        if: ${{ github.event_name == 'release' }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Using version: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        run: uv sync

      - name: Backend lint (Ruff)
        run: |
          uv run ruff check app/ tests/ --fix
          uv run ruff format app/ tests/
          uv run ruff check app/ tests/
          uv run ruff format --check app/ tests/

      - name: Backend type check (Pyright)
        run: uv run pyright app/

      - name: Backend tests (pytest)
        run: PYTHONPATH=. uv run pytest tests/ -v

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Frontend format check (Prettier)
        run: |
          cd frontend
          npm run format:check

      - name: Frontend tests
        run: |
          cd frontend
          npm run test:run

      - name: Frontend build
        run: |
          cd frontend
          npm run build

      - name: Build bundle
        if: ${{ github.event_name == 'release' }}
        run: |
          bash scripts/build_release_bundle.sh

      - name: Upload bundle to release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bundle/remoteterm-linux-x64.tar.gz

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'release' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'release' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ github.event_name == 'release' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
